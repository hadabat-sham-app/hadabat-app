name: keepalive
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping database
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST 'https://sldyxjzofzlgszqebgbg.supabase.co/rest/v1/rpc/version' -H 'apikey: sb_publishable_CfQPHmlPeGcKVuGtgdhK0w__1MRfQJ2' -H 'Content-Type: application/json' -d '{}')
            echo "attempt $i http $code: $(cat out.txt)"
            [ "$code" = 200 ] && exit 0
            sleep 20
          done
          exit 1
