name: Build Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Icon
        run: cp ../docs/2-icon-512.png icon.png
      - run: npm install
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "desktop-v$V" >/dev/null 2>&1 || gh release create "desktop-v$V" --title "هضبة الشام لويندوز v$V" --notes "Windows installer"
          gh release upload "desktop-v$V" "dist/HadbatAlSham-Setup-$V.exe" --clobber
