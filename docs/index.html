<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>هضبة الشام</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#8a3515"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#7a2e12">
<style>
:root{--p:#8a3515;--p2:#6b2610;--a:#e0a526;--bg:#f6f1ea;--g:#2e7d32;--r:#c62828;--t:#2b2118}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:16px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;flex:1}header .u{font-size:13px;opacity:.9}header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--a);color:var(--p2);font-weight:800;display:flex;align-items:center;justify-content:center}
nav{display:flex;background:#fff;box-shadow:0 1px 4px #0002;position:sticky;top:58px;z-index:4;overflow-x:auto}
nav button{flex:1;min-width:76px;border:0;background:#fff;padding:12px 6px;font-size:15px;color:#6d5a4a;border-bottom:3px solid transparent}

main{max-width:900px;margin:auto;padding:12px 12px 90px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px #0001}.stat small{color:#7a6a5c}.stat b{display:block;font-size:20px;margin-top:4px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.row .n{flex:1}.row .s{font-size:13px;color:#7a6a5c}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;color:#fff;background:var(--p)}.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.o{background:var(--a);color:#3a2a0a}.btn.l{background:#eee;color:#333}.btn.sm{padding:6px 10px;font-size:14px}
input,select{width:100%;padding:11px;border:1px solid #d8cdbf;border-radius:10px;font-size:16px;margin:4px 0 10px;background:#fff;font-family:inherit}
label{font-size:14px;color:#6d5a4a}.low{color:var(--r);font-weight:700}.pos{color:var(--g)}.neg{color:var(--r)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal>div{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow:auto}

.login{max-width:380px;margin:8vh auto;padding:24px}.login .logo{width:72px;height:72px;font-size:34px;margin:0 auto 10px;border-radius:20px}.login h2{text-align:center;color:var(--p);margin:0 0 4px}.login p{text-align:center;color:#7a6a5c;margin:0 0 18px}
.tabs2{display:flex;gap:6px;margin-bottom:10px}.tabs2 button{flex:1}

</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);let T=localStorage.tok||'',S=null,tab='home',live=false,ev;
const SB='https://sldyxjzofzlgszqebgbg.supabase.co/rest/v1/rpc/',KEY='sb_publishable_CfQPHmlPeGcKVuGtgdhK0w__1MRfQJ2';
const rpc=async(fn,a)=>{const r=await fetch(SB+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(a||{})});const j=await r.json().catch(()=>({}));if(!r.ok){const m=j.message||'خطأ في الاتصال';if(/unauth|جلسة/i.test(m)&&fn!=='login'){logout();throw 0}throw m}return j};
const api=(p,b)=>{b=b||{};switch(p){
case'login':return rpc('login',{p_user:b.username,p_pass:b.password});
case'state':return rpc('state',{t:T});
case'item':return rpc('add_item',{t:T,p_name:b.name,p_unit:b.unit,p_qty:b.qty||0,p_cost:b.cost||0,p_min:b.min||0});
case'item/edit':return rpc('edit_item',{t:T,p_id:b.id,p_name:b.name,p_min:b.min});
case'item/delete':return rpc('delete_item',{t:T,p_id:b.id});
case'move':return rpc('add_move',{t:T,p_item:b.itemId,p_type:b.type,p_qty:b.qty,p_price:b.price===undefined?null:b.price,p_dest:b.dest||'',p_note:b.note||''});
case'tx':return rpc('add_tx',{t:T,p_type:b.type,p_cat:b.cat,p_amount:b.amount,p_note:b.note||''});
case'delete':return rpc('delete_rec',{t:T,p_id:b.id});
case'users':return rpc('add_user',{t:T,p_user:b.username,p_name:b.name,p_pass:b.password,p_role:b.role});
case'password':return rpc('change_password',{t:T,p_pass:b.password});
}throw 'غير معروف'};
const ad=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/\./g,'٫');
const fn=n=>ad((Math.round(n*100)/100).toLocaleString('en-US'));const money=n=>fn(n)+' ج.م';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pn=s=>parseFloat(String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫،,]/g,'.'));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function logout(){localStorage.tok='';T='';S=null;clearInterval(pt);show()}
function show(){if(!T){rpc('needs_setup').then(n=>n?setupView():loginView()).catch(()=>loginView());return}load()}
function setupView(){$('#app').innerHTML=`<div class="card login"><div class="logo">ه</div><h2>هضبة الشام</h2><p>إعداد أول مرة: أنشئ حساب المدير</p><label>اسم المستخدم</label><input id="su" value="admin" autocapitalize="none"><label>كلمة المرور (٦ أحرف على الأقل)</label><input id="sp" type="password" autocomplete="new-password"><button class="btn" style="width:100%" id="sb">إنشاء</button></div>`;$('#sb').onclick=async()=>{try{await rpc('setup_admin',{p_user:$('#su').value,p_pass:$('#sp').value});toast('تم الإنشاء، سجّل الدخول');loginView()}catch(e){toast(e)}}}
function loginView(){$('#app').innerHTML=`<div class="card login"><div class="logo">ه</div><h2>هضبة الشام</h2><p>نظام المخزون والحسابات</p><label>اسم المستخدم</label><input id="lu" autocomplete="username" autocapitalize="none"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"><button class="btn" style="width:100%" id="lb">دخول</button></div>`;
 const go=async()=>{try{const r=await api('login',{username:$('#lu').value,password:$('#lp').value});T=r.token;localStorage.tok=T;load()}catch(e){toast(e)}};$('#lb').onclick=go;$('#lp').onkeydown=e=>e.key==='Enter'&&go()}
async function load(){try{S=await api('state');render();connect()}catch(e){}}
let lastV=null,pt;function connect(){clearInterval(pt);const tick=async()=>{if(document.hidden||!T)return;try{const v=await rpc('version');live=true;dot();if(lastV!==null&&v!==lastV)refresh();lastV=v}catch(e){live=false;dot()}};tick();pt=setInterval(tick,2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})}
function dot(){const d=$('#dot');if(d)d.className='live'+(live?'':' off')}
let rt;function refresh(){clearTimeout(rt);rt=setTimeout(async()=>{try{S=await api('state');if(!document.querySelector('.modal'))render()}catch(e){}},150)}
const tabs=[['home','الرئيسية'],['stock','المخزون'],['moves','الحركات'],['money','المبيعات والمصروفات'],['rep','التقارير']];
function render(){const adm=S.me.role==='admin';let tt=tabs.slice();if(adm)tt.push(['set','الإعدادات']);
 $('#app').innerHTML=`<header><div class="logo">ه</div><h1>هضبة الشام</h1><span class="u"><span id="dot" class="live ${live?'':'off'}"></span> ${esc(S.me.name)}</span><button onclick="logout()">خروج</button></header><nav>${tt.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav><main id="m"></main>`;
 ({home,stock,moves,money:moneyV,rep,set})[tab==='money'?'money':tab]();}
const iname=id=>(S.items.find(i=>i.id===id)||{name:'(محذوف)'}).name;
const iu=id=>(S.items.find(i=>i.id===id)||{unit:''}).unit;
const dstr=a=>{const d=new Date(a);return ad(d.toLocaleDateString('en-GB'))+' '+ad(d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))};
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function home(){const k=dkey(new Date()),td=S.txs.filter(t=>dkey(t.at)===k),sa=td.filter(t=>t.type==='sale').reduce((a,t)=>a+t.amount,0),ex=td.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
 const val=S.items.reduce((a,i)=>a+i.qty*i.cost,0),low=S.items.filter(i=>i.min>0&&i.qty<=i.min);
 const outs=S.moves.filter(m=>m.type==='out'&&dkey(m.at)===k);const outv=outs.reduce((a,m)=>a+m.qty*m.price,0);
 $('#m').innerHTML=`<div class="grid"><div class="stat"><small>مبيعات اليوم</small><b class="pos">${money(sa)}</b></div><div class="stat"><small>مصروفات اليوم</small><b class="neg">${money(ex)}</b></div><div class="stat"><small>قيمة المخزون</small><b>${money(val)}</b></div><div class="stat"><small>المسحوب اليوم للمطبخ والصالة</small><b>${money(outv)}</b></div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0"><button class="btn g" style="padding:16px" onclick="moveDlg('in')">＋ إضافة مخزون</button><button class="btn r" style="padding:16px" onclick="moveDlg('out')">－ سحب للمطبخ</button></div>
 ${low.length?`<div class="card"><b class="low">⚠ أصناف قاربت على النفاد</b>${low.map(i=>`<div class="row"><span class="n">${esc(i.name)}</span><span class="low">${fn(i.qty)} ${esc(i.unit)}</span></div>`).join('')}</div>`:''}
 <div class="card"><b>آخر الحركات</b>${moveRows(S.moves.slice(-8).reverse())||'<p class="s">لا توجد حركات</p>'}</div>`}
function moveRows(a){return a.map(m=>`<div class="row"><div class="n">${esc(iname(m.itemId))}<div class="s">${m.type==='in'?'إضافة':m.type==='out'?'سحب إلى '+esc(m.dest):'تسوية'} · ${esc(m.user)} · ${dstr(m.at)}${m.note?' · '+esc(m.note):''}</div></div><b class="${m.type==='in'?'pos':m.type==='out'?'neg':''}">${m.type==='in'?'+':m.type==='out'?'−':''}${fn(m.qty)} ${esc(iu(m.itemId))}</b>${S.me.role==='admin'?`<button class="btn l sm" onclick="del(${m.id})">🗑</button>`:''}</div>`).join('')}
async function del(id){if(!confirm('حذف هذه الحركة؟'))return;try{await api('delete',{id});toast('تم الحذف')}catch(e){toast(e)}}
function stock(){const q=window._q||'';$('#m').innerHTML=`<div style="display:flex;gap:8px"><input placeholder="بحث عن صنف" value="${esc(q)}" oninput="window._q=this.value;stockList()"><button class="btn o" style="height:46px;white-space:nowrap" onclick="itemDlg()">＋ صنف</button></div><div class="card" id="sl"></div>`;stockList()}
function stockList(){const q=(window._q||'').trim();const a=S.items.filter(i=>i.name.includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 $('#sl').innerHTML=a.map(i=>`<div class="row"><div class="n"><b>${esc(i.name)}</b><div class="s">التكلفة ${money(i.cost)} / ${esc(i.unit)} · القيمة ${money(i.qty*i.cost)}</div></div><b class="${i.min>0&&i.qty<=i.min?'low':''}">${fn(i.qty)} ${esc(i.unit)}</b><button class="btn g sm" onclick="moveDlg('in',${i.id})">＋</button><button class="btn r sm" onclick="moveDlg('out',${i.id})">－</button><button class="btn l sm" onclick="itemEdit(${i.id})">✎</button></div>`).join('')||'<p class="s">لا توجد أصناف. اضغط ＋ صنف لإضافة أول صنف.</p>'}
function moves(){$('#m').innerHTML=`<div class="card">${moveRows(S.moves.slice().reverse().slice(0,200))||'<p class="s">لا توجد حركات</p>'}</div>`}
function dlg(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+h+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function itemDlg(){const m=dlg(`<h3>صنف جديد</h3><label>اسم الصنف</label><input id="a1"><label>الوحدة</label><select id="a2">${['كجم','جرام','لتر','عبوة','كرتونة','قطعة','علبة','كيس'].map(u=>`<option>${u}</option>`).join('')}</select><label>الكمية الحالية (رصيد افتتاحي)</label><input id="a3" inputmode="decimal" value="0"><label>سعر الوحدة (ج.م)</label><input id="a4" inputmode="decimal" value="0"><label>حد التنبيه (ينبه عند وصول الكمية له)</label><input id="a5" inputmode="decimal" value="0"><button class="btn" style="width:100%" id="ok">حفظ</button>`);
 m.querySelector('#ok').onclick=async()=>{try{await api('item',{name:m.querySelector('#a1').value,unit:m.querySelector('#a2').value,qty:pn(m.querySelector('#a3').value),cost:pn(m.querySelector('#a4').value),min:pn(m.querySelector('#a5').value)});m.remove();toast('تمت الإضافة');refresh()}catch(e){toast(e)}}}
function itemEdit(id){const i=S.items.find(x=>x.id===id);const adm=S.me.role==='admin';const m=dlg(`<h3>تعديل صنف</h3><label>الاسم</label><input id="a1" value="${esc(i.name)}"><label>حد التنبيه</label><input id="a5" inputmode="decimal" value="${i.min}"><button class="btn" style="width:100%" id="ok">حفظ</button><button class="btn o" style="width:100%;margin-top:8px" id="adj">تسوية الجرد (ضبط الكمية الفعلية)</button>${adm?'<button class="btn r" style="width:100%;margin-top:8px" id="dl">حذف الصنف</button>':''}`);
 m.querySelector('#ok').onclick=async()=>{try{await api('item/edit',{id,name:m.querySelector('#a1').value,min:pn(m.querySelector('#a5').value)});m.remove();refresh()}catch(e){toast(e)}};
 m.querySelector('#adj').onclick=async()=>{const v=prompt('الكمية الفعلية الموجودة الآن ('+i.unit+')');if(v===null)return;const t=pn(v);if(isNaN(t)||t<0)return toast('كمية غير صحيحة');try{await api('move',{itemId:id,type:'adjust',qty:t-i.qty,note:'تسوية جرد'});m.remove();toast('تمت التسوية')}catch(e){toast(e)}};
 if(adm)m.querySelector('#dl').onclick=async()=>{if(confirm('حذف الصنف وكل حركاته؟')){await api('item/delete',{id});m.remove();refresh()}}}
function moveDlg(type,id){if(!S.items.length){toast('أضف صنف أولًا من تبويب المخزون');return}const isIn=type==='in';
 const m=dlg(`<h3>${isIn?'إضافة مخزون':'سحب للمطبخ / الصالة'}</h3><label>الصنف</label><select id="b1">${S.items.map(i=>`<option value="${i.id}" ${i.id===id?'selected':''}>${esc(i.name)} (${fn(i.qty)} ${esc(i.unit)})</option>`).join('')}</select><label>الكمية</label><input id="b2" inputmode="decimal" autofocus>${isIn?'<label>سعر الوحدة (اختياري)</label><input id="b3" inputmode="decimal">':'<label>الجهة</label><select id="b4"><option>المطبخ</option><option>الصالة</option><option>أخرى</option></select>'}<label>ملاحظة (اختياري)</label><input id="b5"><button class="btn ${isIn?'g':'r'}" style="width:100%" id="ok">${isIn?'تأكيد الإضافة':'تأكيد السحب'}</button>`);
 m.querySelector('#ok').onclick=async()=>{try{await api('move',{type,itemId:+m.querySelector('#b1').value,qty:pn(m.querySelector('#b2').value),price:isIn?pn(m.querySelector('#b3').value):undefined,dest:isIn?'':m.querySelector('#b4').value,note:m.querySelector('#b5').value});m.remove();toast('تم التسجيل')}catch(e){toast(e)}}}
const SC=['مبيعات نقدي','مبيعات فيزا','توصيل / تطبيقات','أخرى'],EC=['مشتريات','رواتب','إيجار','مرافق (كهرباء/غاز/مياه)','صيانة','أخرى'];
function moneyV(){$('#m').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px"><button class="btn g" onclick="txDlg('sale')">＋ مبيعات</button><button class="btn r" onclick="txDlg('expense')">＋ مصروف</button></div><div class="card">${S.txs.slice().reverse().slice(0,200).map(t=>`<div class="row"><div class="n">${esc(t.cat)}<div class="s">${esc(t.user)} · ${dstr(t.at)}${t.note?' · '+esc(t.note):''}</div></div><b class="${t.type==='sale'?'pos':'neg'}">${t.type==='sale'?'+':'−'}${money(t.amount)}</b>${S.me.role==='admin'?`<button class="btn l sm" onclick="del(${t.id})">🗑</button>`:''}</div>`).join('')||'<p class="s">لا توجد حركات</p>'}</div>`}
function txDlg(type){const c=type==='sale'?SC:EC;const m=dlg(`<h3>${type==='sale'?'تسجيل مبيعات':'تسجيل مصروف'}</h3><label>البند</label><select id="c1">${c.map(x=>`<option>${x}</option>`).join('')}</select><label>المبلغ (ج.م)</label><input id="c2" inputmode="decimal"><label>ملاحظة (اختياري)</label><input id="c3"><button class="btn" style="width:100%" id="ok">حفظ</button>`);
 m.querySelector('#ok').onclick=async()=>{try{await api('tx',{type,cat:m.querySelector('#c1').value,amount:pn(m.querySelector('#c2').value),note:m.querySelector('#c3').value});m.remove();toast('تم الحفظ')}catch(e){toast(e)}}}
let rp='week';
function rep(){const now=new Date();let from;if(rp==='day'){from=new Date(now);from.setHours(0,0,0,0)}else if(rp==='week'){from=new Date(now);from.setDate(from.getDate()-6);from.setHours(0,0,0,0)}else{from=new Date(now.getFullYear(),now.getMonth(),1)}
 const tx=S.txs.filter(t=>new Date(t.at)>=from),mv=S.moves.filter(m=>new Date(t=m.at)>=from);const sum=(a,f)=>a.filter(f).reduce((x,t)=>x+t.amount,0);
 const sa=sum(tx,t=>t.type==='sale'),ex=sum(tx,t=>t.type==='expense'),net=sa-ex;
 const outs=mv.filter(m=>m.type==='out'),ins=mv.filter(m=>m.type==='in');const outv=outs.reduce((a,m)=>a+m.qty*m.price,0),inv=ins.reduce((a,m)=>a+m.qty*m.price,0);
 const by={};tx.forEach(t=>{const k=t.type+t.cat;by[k]=(by[k]||0)+t.amount});
 const per={};outs.forEach(m=>{const k=m.itemId;per[k]=(per[k]||0)+m.qty});
 $('#m').innerHTML=`<div class="tabs2">${[['day','اليوم'],['week','آخر ٧ أيام'],['month','الشهر']].map(x=>`<button class="btn ${rp===x[0]?'':'l'}" onclick="rp='${x[0]}';rep()">${x[1]}</button>`).join('')}</div>
 <div class="card"><div class="row"><span class="n">إجمالي المبيعات</span><b class="pos">${money(sa)}</b></div><div class="row"><span class="n">إجمالي المصروفات</span><b class="neg">${money(ex)}</b></div><div class="row"><b class="n">${net>=0?'صافي الربح':'صافي الخسارة'}</b><b class="${net>=0?'pos':'neg'}">${money(Math.abs(net))}</b></div></div>
 <div class="card"><b>تفصيل المبيعات والمصروفات</b>${Object.keys(by).map(k=>`<div class="row"><span class="n">${esc(k.replace(/^(sale|expense)/,''))} <small class="s">(${k.startsWith('sale')?'مبيعات':'مصروف'})</small></span><b>${money(by[k])}</b></div>`).join('')||'<p class="s">لا بيانات</p>'}</div>
 <div class="card"><b>المخزون في الفترة</b><div class="row"><span class="n">قيمة المشتريات المضافة</span><b>${money(inv)}</b></div><div class="row"><span class="n">قيمة المسحوب للمطبخ والصالة (بتكلفة الشراء)</span><b>${money(outv)}</b></div><div class="row"><span class="n">قيمة المخزون الحالية</span><b>${money(S.items.reduce((a,i)=>a+i.qty*i.cost,0))}</b></div></div>
 <div class="card"><b>الأصناف المسحوبة</b>${Object.keys(per).sort((a,b)=>per[b]-per[a]).map(k=>`<div class="row"><span class="n">${esc(iname(+k))}</span><b>${fn(per[k])} ${esc(iu(+k))}</b></div>`).join('')||'<p class="s">لا يوجد سحب</p>'}</div>`}
function set(){$('#m').innerHTML=`<div class="card"><b>المستخدمون</b>${S.users.map(u=>`<div class="row"><span class="n">${esc(u.name)} <small class="s">(${esc(u.username)})</small></span><span class="s">${u.role==='admin'?'مدير':'موظف'}</span></div>`).join('')}<hr><label>اسم الموظف</label><input id="d0"><label>اسم المستخدم (إنجليزي)</label><input id="d1" autocapitalize="none"><label>كلمة المرور (٦ أحرف على الأقل)</label><input id="d2"><label>الصلاحية</label><select id="d3"><option value="staff">موظف (إضافة وسحب)</option><option value="admin">مدير (حذف وإعدادات)</option></select><button class="btn" id="du" style="width:100%">إضافة مستخدم</button></div>
 <div class="card"><b>تغيير كلمة مروري</b><input id="e1" type="password" placeholder="كلمة المرور الجديدة"><button class="btn o" id="ep" style="width:100%">تغيير</button></div>`;
 $('#du').onclick=async()=>{try{await api('users',{name:$('#d0').value,username:$('#d1').value,password:$('#d2').value,role:$('#d3').value});toast('تمت الإضافة');refresh()}catch(e){toast(e)}};
 $('#ep').onclick=async()=>{try{await api('password',{password:$('#e1').value});toast('تم التغيير');$('#e1').value=''}catch(e){toast(e)}}}
show();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
