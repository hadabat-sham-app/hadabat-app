const RD=['version','state','needs_setup'];const post=async(fn,a)=>{for(let i=0;;i++){try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);try{return await fetch(SB+fn,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(a||{})})}finally{clearTimeout(tm)}}catch(e){if(!RD.includes(fn)||i>=2)throw 'لا يوجد اتصال بالإنترنت، حاول مرة أخرى';await new Promise(r=>setTimeout(r,800*(i+1)))}}};

const getQ=()=>{try{return JSON.parse(localStorage.q||'[]')}catch(e){return[]}};const setQ=q=>{localStorage.q=JSON.stringify(q);const el=document.getElementById('qb');if(el){el.style.display=q.length?'block':'none';el.textContent='⏳ '+q.length+' عملية محفوظة على الجهاز وهتتسجل أول ما الإنترنت يرجع'}};
