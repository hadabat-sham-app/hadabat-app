<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>هضبة الشام</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#8a3515"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#7a2e12">
<style>
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}input,textarea,select{-webkit-user-select:text;user-select:text}
@media print{header,nav,.noprint,.modal{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}

:root{--p:#8a3515;--p2:#6b2610;--a:#e0a526;--bg:#f6f1ea;--g:#2e7d32;--r:#c62828;--t:#2b2118}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:16px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;flex:1}header .u{font-size:13px;opacity:.9}header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--a);color:var(--p2);font-weight:800;display:flex;align-items:center;justify-content:center}
nav{display:flex;background:#fff;box-shadow:0 1px 4px #0002;position:sticky;top:58px;z-index:4;overflow-x:auto}
nav button{flex:1;min-width:76px;border:0;background:#fff;padding:12px 6px;font-size:15px;color:#6d5a4a;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--a);font-weight:700}
main{max-width:900px;margin:auto;padding:12px 12px 90px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px #0001}.stat small{color:#7a6a5c}.stat b{display:block;font-size:20px;margin-top:4px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.row .n{flex:1}.row .s{font-size:13px;color:#7a6a5c}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;color:#fff;background:var(--p)}.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.o{background:var(--a);color:#3a2a0a}.btn.l{background:#eee;color:#333}.btn.sm{padding:6px 10px;font-size:14px}
input,select{width:100%;padding:11px;border:1px solid #d8cdbf;border-radius:10px;font-size:16px;margin:4px 0 10px;background:#fff;font-family:inherit}
label{font-size:14px;color:#6d5a4a}.low{color:var(--r);font-weight:700}.pos{color:var(--g)}.neg{color:var(--r)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal>div{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:18px}}
.login{max-width:380px;margin:8vh auto;padding:24px}.login .logo{width:72px;height:72px;font-size:34px;margin:0 auto 10px;border-radius:20px}.login h2{text-align:center;color:var(--p);margin:0 0 4px}.login p{text-align:center;color:#7a6a5c;margin:0 0 18px}
.tabs2{display:flex;gap:6px;margin-bottom:10px}.tabs2 button{flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;z-index:50}
.live{width:9px;height:9px;border-radius:50%;background:#6c6;display:inline-block}.live.off{background:#e55}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid #eee;text-align:right;font-size:15px}
main>*,.card{animation:fi .2s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,.btn,nav button{touch-action:manipulation}html{touch-action:pan-x pan-y}
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#8a3515,#6b2610);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:99;transition:opacity .25s}#splash .l{width:92px;height:92px;border-radius:26px;background:#e0a526;color:#6b2610;font-weight:800;font-size:54px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}#splash b{font-size:24px}
#qb{position:fixed;bottom:0;inset-inline:0;background:#e0a526;color:#2b2118;text-align:center;padding:8px;font-size:14px;z-index:20;display:none}
</style></head><body><div id="splash"><div class="l">ه</div><b>هضبة الشام</b></div><div id="qb"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s);let T=localStorage.tok||'',S=null,tab='home',live=false,ev;
addEventListener('error',e=>{try{toast('حدث خطأ غير متوقع، حاول مرة أخرى')}catch(x){}});addEventListener('unhandledrejection',e=>{e.preventDefault();if(e.reason!==0)try{toast(typeof e.reason==='string'?e.reason:'حدث خطأ غير متوقع، حاول مرة أخرى')}catch(x){}});document.addEventListener('contextmenu',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
const hideSplash=()=>{const p=document.getElementById('splash');if(p){p.style.opacity=0;setTimeout(()=>p.remove(),300)}};setTimeout(hideSplash,4000);
const NETERR='لا يوجد اتصال بالإنترنت، حاول مرة أخرى';
const SB='https://sldyxjzofzlgszqebgbg.supabase.co/rest/v1/rpc/',KEY='sb_publishable_CfQPHmlPeGcKVuGtgdhK0w__1MRfQJ2';
const RD=['version','state','needs_setup'];const post=async(fn,a)=>{for(let i=0;;i++){try{return await fetch(SB+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(a||{})})}catch(e){if(!RD.includes(fn)||i>=2)throw 'لا يوجد اتصال بالإنترنت، حاول مرة أخرى';await new Promise(r=>setTimeout(r,800*(i+1)))}}};
const rpc=async(fn,a)=>{const r=await post(fn,a);const j=await r.json().catch(()=>({}));if(!r.ok){const m=j.message||'خطأ في الاتصال';if(/unauth|جلسة/i.test(m)&&fn!=='login'){logout();throw 0}throw m}return j};
const apiRaw=(p,b)=>{b=b||{};switch(p){
case'login':return rpc('login',{p_user:b.username,p_pass:b.password});
case'state':return rpc('state',{t:T});
case'item':return rpc('add_item',{t:T,p_name:b.name,p_unit:b.unit,p_qty:b.qty||0,p_cost:b.cost||0,p_min:b.min||0});
case'item/edit':return rpc('edit_item',{t:T,p_id:b.id,p_name:b.name,p_min:b.min});
case'item/delete':return rpc('delete_item',{t:T,p_id:b.id});
case'move':return rpc('add_move',{t:T,p_item:b.itemId,p_type:b.type,p_qty:b.qty,p_price:b.price===undefined?null:b.price,p_dest:b.dest||'',p_note:b.note||'',p_at:b.at||null});
case'tx':return rpc('add_tx',{t:T,p_type:b.type,p_cat:b.cat,p_amount:b.amount,p_note:b.note||'',p_at:b.at||null});
case'delete':return rpc('delete_rec',{t:T,p_id:b.id,p_kind:b.kind});
case'editdate':return rpc('edit_date',{t:T,p_id:b.id,p_kind:b.kind,p_at:b.at});
case'users':return rpc('add_user',{t:T,p_user:b.username,p_name:b.name,p_pass:b.password,p_role:b.role});
case'password':return rpc('change_password',{t:T,p_pass:b.password});
}throw 'غير معروف'};
const getQ=()=>{try{return JSON.parse(localStorage.q||'[]')}catch(e){return[]}};const setQ=q=>{localStorage.q=JSON.stringify(q);const el=document.getElementById('qb');if(el){el.style.display=q.length?'block':'none';el.textContent='⏳ '+q.length+' عملية محفوظة على الجهاز وهتتسجل أول ما الإنترنت يرجع'}};
const api=async(p,b)=>{try{return await apiRaw(p,b)}catch(e){if(e===NETERR&&(p==='move'||p==='tx')){setQ(getQ().concat([{p,b}]));toast('مفيش إنترنت، العملية اتحفظت وهتتسجل تلقائياً');return{queued:1}}throw e}};
let flushing=false;async function flushQ(){if(flushing)return;let q=getQ();if(!q.length)return;flushing=true;try{while(q.length){const it=q[0];try{await apiRaw(it.p,it.b)}catch(e){if(e===NETERR)break;toast('تعذر تسجيل عملية محفوظة: '+e)}q=q.slice(1);setQ(q)}}finally{flushing=false}if(!getQ().length)refresh()}
const ad=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/\./g,'٫');
const fn=n=>ad((Math.round(n*100)/100).toLocaleString('en-US'));const money=n=>fn(n)+' ج.م';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pn=s=>parseFloat(String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫،,]/g,'.'));
function toast(m){if(typeof m!=='string'||!m)m='حدث خطأ، حاول مرة أخرى';const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function logout(){localStorage.tok='';localStorage.removeItem('st');T='';S=null;clearInterval(pt);show()}
setQ(getQ());function show(){if(!T){rpc('needs_setup').then(n=>n?setupView():loginView()).catch(()=>loginView());return}load()}
function setupView(){hideSplash();$('#app').innerHTML=`<div class="card login"><div class="logo">ه</div><h2>هضبة الشام</h2><p>إعداد أول مرة: أنشئ حساب المدير</p><label>اسم المستخدم</label><input id="su" value="admin" autocapitalize="none"><label>كلمة المرور (٦ أحرف على الأقل)</label><input id="sp" type="password" autocomplete="new-password"><button class="btn" style="width:100%" id="sb">إنشاء</button></div>`;$('#sb').onclick=async()=>{try{await rpc('setup_admin',{p_user:$('#su').value,p_pass:$('#sp').value});toast('تم الإنشاء، سجّل الدخول');loginView()}catch(e){toast(e)}}}
function loginView(){hideSplash();$('#app').innerHTML=`<div class="card login"><div class="logo">ه</div><h2>هضبة الشام</h2><p>نظام المخزون والحسابات</p><label>اسم المستخدم</label><input id="lu" autocomplete="username" autocapitalize="none"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"><button class="btn" style="width:100%" id="lb">دخول</button></div>`;
 const go=async()=>{try{const r=await api('login',{username:$('#lu').value,password:$('#lp').value});T=r.token;localStorage.tok=T;load()}catch(e){toast(e)}};$('#lb').onclick=go;$('#lp').onkeydown=e=>e.key==='Enter'&&go()}
async function load(){try{const c=localStorage.st;if(c&&!S){S=JSON.parse(c);render()}}catch(e){}try{S=await api('state');try{localStorage.st=JSON.stringify(S)}catch(e){}render();connect()}catch(e){if(S)connect()}}
let lastV=null,pt;function connect(){clearInterval(pt);const tick=async()=>{if(document.hidden||!T)return;try{const v=await rpc('version');live=true;dot();flushQ();if(lastV!==null&&v!==lastV)refresh();lastV=v}catch(e){live=false;dot()}};tick();pt=setInterval(tick,2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})}
function dot(){const d=$('#dot');if(d)d.className='live'+(live?'':' off')}
let rt;function refresh(){clearTimeout(rt);rt=setTimeout(async()=>{try{S=await api('state');try{localStorage.st=JSON.stringify(S)}catch(e){}if(!document.querySelector('.modal'))render()}catch(e){}},150)}
const tabs=[['home','الرئيسية'],['stock','المخزون'],['moves','الحركات'],['money','المبيعات والمصروفات'],['rep','التقارير']];
function render(){hideSplash();const adm=S.me.role==='admin';let tt=tabs.slice();if(adm)tt.push(['set','الإعدادات']);
 $('#app').innerHTML=`<header><div class="logo">ه</div><h1>هضبة الشام</h1><span class="u"><span id="dot" class="live ${live?'':'off'}"></span> ${esc(S.me.name)}</span><button onclick="logout()">خروج</button></header><nav>${tt.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav><main id="m"></main>`;
 ({home,stock,moves,money:moneyV,rep,set})[tab==='money'?'money':tab]();}
const iname=id=>(S.items.find(i=>i.id===id)||{name:'(محذوف)'}).name;
const iu=id=>(S.items.find(i=>i.id===id)||{unit:''}).unit;
const dstr=a=>{const d=new Date(a);return ad(d.toLocaleDateString('en-GB'))+' '+ad(d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))};
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function home(){const k=dkey(new Date()),td=S.txs.filter(t=>dkey(t.at)===k),sa=td.filter(t=>t.type==='sale').reduce((a,t)=>a+t.amount,0),ex=td.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
 const val=S.items.reduce((a,i)=>a+i.qty*i.cost,0),low=S.items.filter(i=>i.min>0&&i.qty<=i.min);
 const outs=S.moves.filter(m=>m.type==='out'&&dkey(m.at)===k);const outv=outs.reduce((a,m)=>a+m.qty*m.price,0);
 $('#m').innerHTML=`<div class="grid"><div class="stat"><small>مبيعات اليوم</small><b class="pos">${money(sa)}</b></div><div class="stat"><small>مصروفات اليوم</small><b class="neg">${money(ex)}</b></div><div class="stat"><small>قيمة المخزون</small><b>${money(val)}</b></div><div class="stat"><small>المسحوب اليوم للمطبخ والصالة</small><b>${money(outv)}</b></div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0"><button class="btn g" style="padding:16px" onclick="moveDlg('in')">＋ إضافة مخزون</button><button class="btn r" style="padding:16px" onclick="moveDlg('out')">－ سحب للمطبخ</button></div>
 ${low.length?`<div class="card"><b class="low">⚠ أصناف قاربت على النفاد</b>${low.map(i=>`<div class="row"><span class="n">${esc(i.name)}</span><span class="low">${fn(i.qty)} ${esc(i.unit)}</span></div>`).join('')}</div>`:''}
 <div class="card"><b>آخر الحركات</b>${moveRows(byAt(S.moves).slice(0,8))||'<p class="s">لا توجد حركات</p>'}</div>`}
function moveRows(a){return a.map(m=>`<div class="row"><div class="n">${esc(iname(m.itemId))}<div class="s">${m.type==='in'?'إضافة':m.type==='out'?'سحب إلى '+esc(m.dest):'تسوية'} · ${esc(m.user)} · ${dstr(m.at)}${m.note?' · '+esc(m.note):''}</div></div><b class="${m.type==='in'?'pos':m.type==='out'?'neg':''}">${m.type==='in'?'+':m.type==='out'?'−':''}${fn(m.qty)} ${esc(iu(m.itemId))}</b>${S.me.role==='admin'?`<button class="btn l sm" onclick="del(${m.id},'move')">🗑</button><button class="btn l sm" onclick="dateDlg(${m.id},'move','${m.at}')">📅</button>`:''}</div>`).join('')}
function del(id,kind){ask('حذف هذه الحركة؟',async()=>{await api('delete',{id,kind});toast('تم الحذف')})}
function stock(){const q=window._q||'';$('#m').innerHTML=`<div style="display:flex;gap:8px"><input placeholder="بحث عن صنف" value="${esc(q)}" oninput="window._q=this.value;stockList()"><button class="btn o" style="height:46px;white-space:nowrap" onclick="itemDlg()">＋ صنف</button></div><div class="card" id="sl"></div>`;stockList()}
function stockList(){const q=(window._q||'').trim();const a=S.items.filter(i=>i.name.includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 $('#sl').innerHTML=a.map(i=>`<div class="row"><div class="n"><b>${esc(i.name)}</b><div class="s">التكلفة ${money(i.cost)} / ${esc(i.unit)} · القيمة ${money(i.qty*i.cost)}</div></div><b class="${i.min>0&&i.qty<=i.min?'low':''}">${fn(i.qty)} ${esc(i.unit)}</b><button class="btn g sm" onclick="moveDlg('in',${i.id})">＋</button><button class="btn r sm" onclick="moveDlg('out',${i.id})">－</button><button class="btn l sm" onclick="itemEdit(${i.id})">✎</button></div>`).join('')||'<p class="s">لا توجد أصناف. اضغط ＋ صنف لإضافة أول صنف.</p>'}
function moves(){$('#m').innerHTML=`<div class="card">${moveRows(byAt(S.moves).slice(0,200))||'<p class="s">لا توجد حركات</p>'}</div>`}
const tdy=()=>dkey(new Date());
const dIso=v=>{if(!v||v===tdy())return null;const n=new Date(),d=new Date(v+'T'+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':00');return d.toISOString()};
const dateF=(id,v)=>`<label>التاريخ</label><input type="date" id="${id}" value="${v||tdy()}" max="${tdy()}">`;
const byAt=a=>a.slice().sort((x,y)=>new Date(y.at)-new Date(x.at)||y.id-x.id);
function ask(msg,cb){const m=dlg(`<h3>${msg}</h3><div style="display:flex;gap:10px"><button class="btn r" style="flex:1" id="yes">نعم، احذف</button><button class="btn l" style="flex:1" id="no">إلغاء</button></div>`);m.querySelector('#no').onclick=()=>m.remove();m.querySelector('#yes').onclick=async()=>{m.remove();try{await cb()}catch(e){toast(e)}}}
function adjDlg(id){const i=S.items.find(x=>x.id===id);const m=dlg(`<h3>جرد: ${esc(i.name)}</h3><label>الكمية الفعلية الموجودة الآن (${esc(i.unit)})</label><input id="q1" inputmode="decimal" autofocus>${dateF('q2')}<button class="btn" style="width:100%" id="ok">تأكيد التسوية</button>`);m.querySelector('#ok').onclick=async()=>{const t=pn(m.querySelector('#q1').value);if(isNaN(t)||t<0)return toast('كمية غير صحيحة');try{await api('move',{itemId:id,type:'adjust',qty:t-i.qty,note:'تسوية جرد',at:dIso(m.querySelector('#q2').value)});m.remove();toast('تمت التسوية')}catch(e){toast(e)}}}
function dateDlg(id,kind,at){const m=dlg(`<h3>تعديل التاريخ</h3>${dateF('e1',dkey(at))}<button class="btn" style="width:100%" id="ok">حفظ</button>`);m.querySelector('#ok').onclick=async()=>{const v=m.querySelector('#e1').value;if(!v)return;const o=new Date(at),d=new Date(v+'T'+String(o.getHours()).padStart(2,'0')+':'+String(o.getMinutes()).padStart(2,'0')+':00');try{await api('editdate',{id,kind,at:d.toISOString()});m.remove();toast('تم تعديل التاريخ')}catch(e){toast(e)}}}
function dlg(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+h+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function itemDlg(){const m=dlg(`<h3>صنف جديد</h3><label>اسم الصنف</label><input id="a1"><label>الوحدة</label><select id="a2">${['كجم','جرام','لتر','عبوة','كرتونة','قطعة','علبة','كيس'].map(u=>`<option>${u}</option>`).join('')}</select><label>الكمية الحالية (رصيد افتتاحي)</label><input id="a3" inputmode="decimal" value="0"><label>سعر الوحدة (ج.م)</label><input id="a4" inputmode="decimal" value="0"><label>حد التنبيه (ينبه عند وصول الكمية له)</label><input id="a5" inputmode="decimal" value="0"><button class="btn" style="width:100%" id="ok">حفظ</button>`);
 m.querySelector('#ok').onclick=async()=>{try{await api('item',{name:m.querySelector('#a1').value,unit:m.querySelector('#a2').value,qty:pn(m.querySelector('#a3').value),cost:pn(m.querySelector('#a4').value),min:pn(m.querySelector('#a5').value)});m.remove();toast('تمت الإضافة');refresh()}catch(e){toast(e)}}}
function itemEdit(id){const i=S.items.find(x=>x.id===id);const adm=S.me.role==='admin';const m=dlg(`<h3>تعديل صنف</h3><label>الاسم</label><input id="a1" value="${esc(i.name)}"><label>حد التنبيه</label><input id="a5" inputmode="decimal" value="${i.min}"><button class="btn" style="width:100%" id="ok">حفظ</button><button class="btn o" style="width:100%;margin-top:8px" id="adj">تسوية الجرد (ضبط الكمية الفعلية)</button>${adm?'<button class="btn r" style="width:100%;margin-top:8px" id="dl">حذف الصنف</button>':''}`);

const z=a+days.length-1;sm.push([{v:'الإجمالي',s:X.totL},{v:S1.tot,f:`SUM(B${a}:B${z})`,s:X.totM},{v:S2.tot,f:`SUM(C${a}:C${z})`,s:X.totM},{v:net,f:`SUM(D${a}:D${z})`,s:X.totM}])}
